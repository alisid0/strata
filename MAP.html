<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strata · Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Kalam:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="map-style.css">
</head>
<body>
<main>
  <a class="back-link" href="index.html">‹ back to the reader</a>

  <!-- ============ SUBJECTS ============ -->
  <section id="view-subjects" class="view active">
    <div class="topline">
      <div class="brand">STRATA</div>
      <div class="level-chip" id="levelChip">Lv.1</div>
    </div>
    <h1>Your tracks</h1>
    <div class="sub">Three subjects, one map that only grows.</div>
    <div class="meter-label"><span id="overallLabel">0 of 0 boards read</span><span id="overallPct">0%</span></div>
    <div class="meter"><div class="meter-fill" id="overallFill" style="width:0%"></div></div>
    <div id="subjectCards"></div>
  </section>

  <!-- ============ THE MAP ============ -->
  <section id="view-map" class="view">
    <div class="topline">
      <h1 style="margin:0;font-size:26px">The Map</h1>
      <div class="sub" id="mapCounter" style="margin:0">0/0</div>
    </div>
    <div class="meter" style="margin-top:10px"><div class="meter-fill" id="mapFill" style="width:0%"></div></div>
    <div class="trail" id="trail" style="margin-top:18px"></div>
  </section>

  <!-- ============ LEADERBOARD ============ -->
  <section id="view-leaderboard" class="view">
    <h1>Leaderboard</h1>
    <div class="sub">Energy earned from boards read, quizzes passed and recalls. (Mock data - no accounts yet.)</div>
    <div class="tabs" id="lbTabs">
      <button data-tab="daily" class="active">Daily</button>
      <button data-tab="weekly">Weekly</button>
      <button data-tab="monthly">Monthly</button>
    </div>
    <div id="lbList"></div>
  </section>
</main>

<nav class="bottom-nav">
  <button data-view="subjects" class="active">Subjects</button>
  <button data-view="map">Map</button>
  <button data-view="leaderboard">Leaderboard</button>
</nav>

<script src="paths-manifest.js"></script>
<script src="progress-store.js"></script>
<script src="subject-mark.js"></script>
<script>
(function(){
  // ---- view switching ----
  function showView(name){
    document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
    document.getElementById('view-' + name).classList.add('active');
    document.querySelectorAll('.bottom-nav button').forEach(function(b){
      b.classList.toggle('active', b.dataset.view === name);
    });
    if(name === 'map') renderMap();
    if(name === 'subjects') renderSubjects();
  }
  document.querySelectorAll('.bottom-nav button').forEach(function(b){
    b.onclick = function(){ showView(b.dataset.view); };
  });

  const TOTAL_BOARDS = 70;
  const STATE_LABELS = {
    unwandered: 'Not started', wandered: 'Wandered', checked: 'Checked',
    well_read: 'Well read', recalled: 'Recalled', mastered_1: 'Mastered ×1', mastered_2: 'Mastered ×2'
  };

  function firstUnreadCard(pathId){
    const data = ProgressStore._load();
    const manifest = PATHS_MANIFEST[pathId];
    for(const n of manifest.cards){
      if(!data.boards[n] || !data.boards[n].firstOpenedAt) return n;
    }
    return manifest.cards[0];
  }

  // ---- Subjects screen ----
  const SUBJECT_PATHS = {
    physics: ['P1', 'P2', 'P3'],
    maths: ['M1', 'M3'],
    chemistry: ['C1']
  };
  const SUBJECT_LABELS = { physics: 'Physics', maths: 'Mathematics', chemistry: 'Chemistry' };

  function renderSubjects(){
    const overall = ProgressStore.getOverallProgress();
    document.getElementById('overallLabel').textContent = overall.read + ' of ' + TOTAL_BOARDS + ' boards read';
    const pct = Math.round((overall.read / TOTAL_BOARDS) * 100);
    document.getElementById('overallPct').textContent = pct + '%';
    document.getElementById('overallFill').style.width = pct + '%';
    document.getElementById('levelChip').textContent = 'Lv.' + (1 + Math.floor(overall.read / 5));

    const container = document.getElementById('subjectCards');
    container.innerHTML = '';
    Object.keys(SUBJECT_PATHS).forEach(function(subject){
      const pathIds = SUBJECT_PATHS[subject];
      let totalCards = 0, readCards = 0, bestPathLabel = null;
      pathIds.forEach(function(pid){
        const st = ProgressStore.getPathState(pid);
        totalCards += st.boardsTotal;
        readCards += st.boardsRead;
        if(st.state !== 'unwandered') bestPathLabel = PATHS_MANIFEST[pid].name + ' — ' + STATE_LABELS[st.state];
      });
      const ringPct = totalCards > 0 ? readCards / totalCards : 0;
      const dashoffset = 126 * (1 - ringPct);
      const card = document.createElement('div');
      card.className = 'subject-card';
      card.innerHTML =
        '<div class="ring">' +
          '<svg viewBox="0 0 44 44"><circle class="progress-bg" cx="22" cy="22" r="20"/>' +
          '<circle class="progress-arc" cx="22" cy="22" r="20" style="stroke-dashoffset:' + dashoffset + '"/></svg>' +
          '<div class="mark"></div>' +
        '</div>' +
        '<div class="info">' +
          '<div class="name">' + SUBJECT_LABELS[subject] + '</div>' +
          '<div class="count">' + readCards + ' / ' + totalCards + ' boards</div>' +
          '<div class="status">' + (bestPathLabel || 'Not started yet') + '</div>' +
        '</div>' +
        '<div class="chev">›</div>';
      card.onclick = function(){ showView('map'); };
      container.appendChild(card);
      renderSubjectMark(card.querySelector('.mark'), { subject: subject === 'maths' ? 'maths' : (subject === 'chemistry' ? 'chem' : 'physics'), accent: '#f2d585', size: 30 });
    });
  }

  // ---- Map / trail screen ----
  function renderMap(){
    const overall = ProgressStore.getOverallProgress();
    document.getElementById('mapCounter').textContent = overall.read + '/' + TOTAL_BOARDS;
    document.getElementById('mapFill').style.width = Math.round((overall.read / TOTAL_BOARDS) * 100) + '%';

    const trail = document.getElementById('trail');
    trail.innerHTML = '';
    Object.keys(PATHS_MANIFEST).forEach(function(pathId){
      const manifest = PATHS_MANIFEST[pathId];
      const st = ProgressStore.getPathState(pathId);
      const stop = document.createElement('div');
      stop.className = 'trail-stop';
      const isCurrent = st.state !== 'unwandered' && st.state !== 'mastered_2';
      stop.innerHTML =
        '<div class="trail-node ' + st.state + '">' +
          (isCurrent ? '<span class="you-are-here">HERE</span>' : '') +
          '<span class="mark"></span>' +
        '</div>' +
        '<a class="trail-label" href="index.html?card=' + firstUnreadCard(pathId) + '" style="text-decoration:none;color:inherit;display:block">' +
          '<div class="name">' + manifest.name + '</div>' +
          '<div class="count">' + st.boardsRead + ' / ' + st.boardsTotal + ' boards · ' + manifest.subject + '</div>' +
          '<div class="state">' + STATE_LABELS[st.state] + '</div>' +
        '</a>';
      trail.appendChild(stop);
      renderSubjectMark(stop.querySelector('.mark'), {
        subject: manifest.subject === 'maths' ? 'maths' : (manifest.subject === 'chemistry' ? 'chem' : 'physics'),
        accent: '#1f3b30', size: 30
      });
    });
  }

  // ---- Leaderboard (mock, no backend/auth yet) ----
  const MOCK_LB = {
    daily: [['Mara K.',980],['Tomás',870],['Priya',845],['Wei',760],['You',712],['Sam',690],['Leah',654]],
    weekly: [['Priya',5420],['Mara K.',5180],['You',4990],['Wei',4610],['Tomás',4540],['Leah',4300],['Sam',4120]],
    monthly: [['Wei',22300],['Priya',21750],['Mara K.',20900],['Tomás',19800],['You',18650],['Leah',17200],['Sam',16050]]
  };
  function renderLeaderboard(tab){
    const list = document.getElementById('lbList');
    list.innerHTML = '';
    MOCK_LB[tab].forEach(function(row, i){
      const isYou = row[0] === 'You';
      const div = document.createElement('div');
      div.className = 'rank-row' + (isYou ? ' you' : '');
      div.innerHTML =
        '<span class="rank">' + (i+1) + '</span>' +
        '<span class="avatar">' + row[0].charAt(0) + '</span>' +
        '<span class="name">' + row[0] + '</span>' +
        '<span class="score">' + row[1].toLocaleString() + '</span>';
      list.appendChild(div);
    });
  }
  document.querySelectorAll('#lbTabs button').forEach(function(b){
    b.onclick = function(){
      document.querySelectorAll('#lbTabs button').forEach(function(x){ x.classList.remove('active'); });
      b.classList.add('active');
      renderLeaderboard(b.dataset.tab);
    };
  });

  renderSubjects();
  renderLeaderboard('daily');
})();
</script>
</body>
</html>
