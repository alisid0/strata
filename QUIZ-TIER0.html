<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Coordinate Geometry, Tier 0 (CG1-CG17)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Patrick+Hand&family=Architects+Daughter&display=swap" rel="stylesheet">
<style>
  :root{
    --board-1:#2e5642; --board-2:#1d3829;
    --chalk:#f4f1e9; --chalk-dim:#c7ccc0; --chalk-faint:#8fa093;
    --chalk-yellow:#f2d585; --chalk-green:#a9d6a0; --frame:#5a4632;
    --hand:"Kalam","Comic Sans MS",cursive;
    --hand-display:"Architects Daughter","Kalam",cursive;
    --print:"Patrick Hand","Kalam",cursive;
    --bad:#e07a5f;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#16291f;color:var(--chalk);font-family:var(--hand);min-height:100vh;}
  main{max-width:640px;margin:0 auto;padding:40px 24px 80px;}
  h1{font-family:var(--hand-display);font-weight:400;font-size:32px;margin-bottom:6px;}
  .sub{font-family:var(--print);color:var(--chalk-faint);font-size:14px;margin-bottom:28px;}

  #progressWrap{height:8px;background:rgba(244,241,233,0.1);border-radius:4px;margin-bottom:30px;overflow:hidden;}
  #progressBar{height:100%;background:var(--chalk-yellow);width:0%;transition:width .3s;}

  .q-card{
    background:var(--board-1);border:2px solid var(--frame);border-radius:8px;
    padding:24px 26px;margin-bottom:20px;display:none;
  }
  .q-card.active{display:block;}
  .q-tag{font-family:var(--print);font-size:12px;color:var(--chalk-yellow);margin-bottom:8px;}
  .q-text{font-family:var(--hand-display);font-size:19px;margin-bottom:18px;line-height:1.4;}

  .opt{
    display:block;width:100%;text-align:left;background:rgba(0,0,0,0.18);
    border:1.5px solid rgba(244,241,233,0.2);border-radius:6px;
    padding:12px 16px;margin-bottom:10px;color:var(--chalk-dim);
    font-family:var(--hand);font-size:16px;cursor:pointer;transition:.15s;
  }
  .opt:hover{border-color:var(--chalk-yellow);}
  .opt.selected{border-color:var(--chalk-yellow);background:rgba(242,213,133,0.12);}
  .opt.correct{border-color:var(--chalk-green);background:rgba(169,214,160,0.18);color:var(--chalk);}
  .opt.incorrect{border-color:var(--bad);background:rgba(224,122,95,0.18);color:var(--chalk);}
  .opt:disabled, .opt.locked{cursor:default;}

  .numwrap{display:flex;gap:10px;align-items:center;}
  input[type=number]{
    flex:1;padding:12px 14px;border-radius:6px;border:1.5px solid rgba(244,241,233,0.25);
    background:rgba(0,0,0,0.18);color:var(--chalk);font-family:var(--hand);font-size:16px;
  }
  input[type=number]:disabled{opacity:0.7;}
  .checkBtn, .nextBtn, .restartBtn{
    font-family:var(--print);font-size:14px;color:var(--board-2);
    background:var(--chalk-yellow);border:none;border-radius:6px;
    padding:10px 18px;cursor:pointer;margin-top:6px;
  }
  .checkBtn:disabled{opacity:0.4;cursor:not-allowed;}
  .feedback{font-family:var(--print);font-size:13.5px;margin-top:12px;padding-top:10px;border-top:1px dashed rgba(244,241,233,0.15);display:none;}
  .feedback.show{display:block;}
  .feedback.good{color:var(--chalk-green);}
  .feedback.bad{color:var(--bad);}

  .nav{display:flex;justify-content:flex-end;margin-top:14px;}

  #resultCard{
    display:none;background:var(--board-1);border:2px solid var(--chalk-yellow);
    border-radius:8px;padding:32px 28px;text-align:center;
  }
  #resultCard h2{font-family:var(--hand-display);font-size:26px;margin-bottom:10px;}
  #resultCard .score{font-family:var(--hand-display);font-size:46px;color:var(--chalk-yellow);margin:14px 0;}
  #resultCard p{font-family:var(--print);color:var(--chalk-dim);font-size:14px;margin-bottom:18px;}
</style>
</head>
<body>
<main>
  <h1>Quick Quiz — Tier 0 complete</h1>
  <div class="sub">CG1 to CG17, the plane itself · 17 questions · one per locked BB</div>
  <div id="progressWrap"><div id="progressBar"></div></div>
  <div id="quizArea"></div>
  <div id="resultCard">
    <h2>Done</h2>
    <div class="score" id="scoreText"></div>
    <p id="scoreSub"></p>
    <button class="restartBtn" onclick="restart()">Try again</button>
  </div>
</main>

<script>
const QUESTIONS = [
  {cg:"CG1", q:"Which statement is true about a number line?", type:"mcq",
   opts:["It only contains whole numbers","Every point on it corresponds to exactly one real number","It only goes in one direction","It starts at 1"], answer:1,
   explain:"A number line matches every point to exactly one real number, in order, extending infinitely both ways."},

  {cg:"CG2", q:"Zero on the number line is best described as:", type:"mcq",
   opts:["The starting point — nothing exists before it","The fixed reference point all distances and signs are measured from","The biggest number","An optional marker"], answer:1,
   explain:"Zero isn't an edge or a start — it's the fixed point everything else is measured against."},

  {cg:"CG3", q:"Why is \"right of zero = positive\" the rule we use?", type:"mcq",
   opts:["It's a law of mathematics that can never change","It's a convention everyone agreed on, not a necessity","Negative numbers aren't real","Computers require it"], answer:1,
   explain:"Right = positive is a convention. Nothing stops you flipping it, except that everyone already agreed not to."},

  {cg:"CG4", q:"How many numbers exist strictly between 1 and 2 on the number line?", type:"mcq",
   opts:["0","Exactly 1 (just 1.5)","10","Infinitely many"], answer:3,
   explain:"However finely you slice the gap between any two numbers, there's always another number living there."},

  {cg:"CG5", q:"Which is bigger: −2 or −7?", type:"mcq",
   opts:["−2","−7","They're equal","Cannot be determined"], answer:0,
   explain:"−2 sits further right on the line than −7, so −2 is bigger — sign and digit size don't matter, only position."},

  {cg:"CG6", q:"What is the distance between 4 and 11 on the number line?", type:"numeric", answer:7,
   explain:"Distance is |a − b| = |4 − 11| = 7."},

  {cg:"CG7", q:"What is the midpoint of 4 and 12?", type:"numeric", answer:8,
   explain:"Midpoint = (4 + 12) / 2 = 8."},

  {cg:"CG8", q:"Why can't one number line pinpoint a single seat in a theatre?", type:"mcq",
   opts:["Number lines can't handle big numbers","You need two independent pieces of information at once (row and seat)","Theatres are three-dimensional","Seats aren't numbers"], answer:1,
   explain:"One line only describes one direction. Pinpointing a seat needs two independent numbers at once — row and seat."},

  {cg:"CG9", q:"Which axis is conventionally the horizontal, \"input\" axis?", type:"mcq",
   opts:["The y-axis","The x-axis"], answer:1,
   explain:"x is horizontal and conventionally the input — you choose x first, then y comes out, as in y = f(x)."},

  {cg:"CG10", q:"What are the coordinates of the origin?", type:"mcq",
   opts:["(1, 1)","(0, 0)","(x, y)","It has no fixed coordinates"], answer:1,
   explain:"The origin is where both axes' zeros line up — (0, 0)."},

  {cg:"CG11", q:"To plot the point (5, 2), what's the first move?", type:"mcq",
   opts:["Move up 2 from the origin","Move right 5 along the x-axis","Move left 5","Move down 2"], answer:1,
   explain:"The first number in an ordered pair is always the horizontal move along x, done first."},

  {cg:"CG12", q:"To read off a point's y-coordinate, you measure its distance from:", type:"mcq",
   opts:["The y-axis","The x-axis","The origin only","Quadrant I"], answer:1,
   explain:"Distance from the x-axis gives you y; distance from the y-axis gives you x — the reverse of what you'd guess."},

  {cg:"CG13", q:"Starting at Quadrant I (top-right), which direction do you sweep to label II, III, IV?", type:"mcq",
   opts:["Clockwise","Anticlockwise"], answer:1,
   explain:"The convention sweeps anticlockwise: I (top-right) → II (top-left) → III (bottom-left) → IV (bottom-right)."},

  {cg:"CG14", q:"A point at (−3, 5) sits in which quadrant?", type:"mcq",
   opts:["I","II","III","IV"], answer:1,
   explain:"x negative, y positive = (−, +) = Quadrant II."},

  {cg:"CG15", q:"What is the distance between (0,0) and (6,8)?", type:"numeric", answer:10,
   explain:"distance² = 6² + 8² = 36 + 64 = 100, so distance = 10. The horizontal and vertical gaps are the two legs of a right triangle; the distance is the hypotenuse."},

  {cg:"CG16", q:"What is the midpoint of (2,2) and (8,6)?", type:"mcq",
   opts:["(5, 4)","(4, 5)","(10, 8)","(3, 2)"], answer:0,
   explain:"Average each axis separately: ((2+8)/2, (2+6)/2) = (5, 4)."},

  {cg:"CG17", q:"Four points form a shape. Two opposite sides measure 4 and 4, the other two measure 3 and 3, using the distance formula. What does that prove?", type:"mcq",
   opts:["Nothing — you'd still need to look at it","The shape's opposite sides are equal, confirming a rectangle","The shape must be a circle","The points aren't connected"], answer:1,
   explain:"Equal opposite-side lengths, found by calculation rather than by eye, is exactly how you prove a shape is a rectangle."},
];

let current = 0;
let score = 0;
const answered = new Array(QUESTIONS.length).fill(false);

const quizArea = document.getElementById('quizArea');

function render(){
  quizArea.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'q-card' + (i === current ? ' active' : '');
    card.id = 'card'+i;

    let inner = `<div class="q-tag">${q.cg} · question ${i+1} of ${QUESTIONS.length}</div><div class="q-text">${q.q}</div>`;

    if(q.type === 'mcq'){
      inner += q.opts.map((opt,oi)=>`<button class="opt" data-i="${oi}" onclick="selectOpt(${i},${oi})">${opt}</button>`).join('');
    } else {
      inner += `<div class="numwrap"><input type="number" id="numInput${i}" placeholder="Your answer"><button class="checkBtn" onclick="checkNumeric(${i})">Check</button></div>`;
    }

    inner += `<div class="feedback" id="fb${i}"></div>
      <div class="nav"><button class="nextBtn" id="next${i}" style="display:none" onclick="goNext(${i})">${i===QUESTIONS.length-1?'See score':'Next'}</button></div>`;

    card.innerHTML = inner;
    quizArea.appendChild(card);
  });
  updateProgress();
}

function updateProgress(){
  const done = answered.filter(Boolean).length;
  document.getElementById('progressBar').style.width = (done/QUESTIONS.length*100)+'%';
}

function lockCard(i){
  const card = document.getElementById('card'+i);
  card.querySelectorAll('.opt').forEach(b=>{ b.classList.add('locked'); b.onclick=null; });
  const inp = document.getElementById('numInput'+i);
  if(inp) inp.disabled = true;
  const btn = card.querySelector('.checkBtn');
  if(btn) btn.disabled = true;
  document.getElementById('next'+i).style.display = 'inline-block';
}

function showFeedback(i, isCorrect, explain){
  const fb = document.getElementById('fb'+i);
  fb.className = 'feedback show ' + (isCorrect ? 'good' : 'bad');
  fb.textContent = (isCorrect ? 'Correct. ' : 'Not quite. ') + explain;
}

function selectOpt(i, oi){
  if(answered[i]) return;
  answered[i] = true;
  const q = QUESTIONS[i];
  const isCorrect = oi === q.answer;
  if(isCorrect) score++;
  const card = document.getElementById('card'+i);
  card.querySelectorAll('.opt').forEach((b,bi)=>{
    if(bi === q.answer) b.classList.add('correct');
    if(bi === oi && oi !== q.answer) b.classList.add('incorrect');
    if(bi === oi) b.classList.add('selected');
  });
  showFeedback(i, isCorrect, q.explain);
  lockCard(i);
  updateProgress();
}

function checkNumeric(i){
  if(answered[i]) return;
  const inp = document.getElementById('numInput'+i);
  const val = parseFloat(inp.value);
  const q = QUESTIONS[i];
  const isCorrect = !isNaN(val) && Math.abs(val - q.answer) < 1e-6;
  answered[i] = true;
  if(isCorrect) score++;
  inp.style.borderColor = isCorrect ? '#a9d6a0' : '#e07a5f';
  showFeedback(i, isCorrect, q.explain);
  lockCard(i);
  updateProgress();
}

function goNext(i){
  document.getElementById('card'+i).classList.remove('active');
  if(i === QUESTIONS.length-1){
    showResult();
    return;
  }
  current = i+1;
  document.getElementById('card'+current).classList.add('active');
}

function showResult(){
  document.getElementById('quizArea').style.display = 'none';
  const card = document.getElementById('resultCard');
  card.style.display = 'block';
  document.getElementById('scoreText').textContent = score + ' / ' + QUESTIONS.length;
  let msg;
  if(score === QUESTIONS.length) msg = "Clean sweep. Tier 0's foundations are solid — ready for Tier 1 (Lines).";
  else if(score >= QUESTIONS.length*0.7) msg = "Solid. Worth a quick second pass on the ones you missed.";
  else msg = "A few gaps worth revisiting before moving to Tier 1.";
  document.getElementById('scoreSub').textContent = msg;
}

function restart(){
  current = 0; score = 0;
  answered.fill(false);
  document.getElementById('resultCard').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  render();
}

render();
</script>
</body>
</html>
