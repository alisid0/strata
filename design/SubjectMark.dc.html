<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%;height:100%;color:inherit;display:flex;align-items:center;justify-content:center">
  <sc-if value="{{ isPhysics }}" hint-placeholder-val="{{ true }}">
    <svg viewBox="0 0 64 64" width="100%" height="100%" fill="none" style="display:block;overflow:visible">
      <defs><filter id="chalkmark" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap></filter></defs>
      <g filter="url(#chalkmark)">
        <ellipse cx="32" cy="32" rx="26" ry="10.5" stroke="currentColor" stroke-width="2.4"></ellipse>
        <ellipse cx="32" cy="32" rx="26" ry="10.5" stroke="currentColor" stroke-width="2.4" transform="rotate(60 32 32)"></ellipse>
        <ellipse cx="32" cy="32" rx="26" ry="10.5" stroke="currentColor" stroke-width="2.4" transform="rotate(120 32 32)"></ellipse>
        <circle cx="32" cy="32" r="4.6" fill="{{ accent }}"></circle>
      </g>
    </svg>
  </sc-if>
  <sc-if value="{{ isMaths }}" hint-placeholder-val="{{ true }}">
    <svg viewBox="0 0 64 64" width="100%" height="100%" fill="none" style="display:block;overflow:visible">
      <defs><filter id="chalkmark2" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap></filter></defs>
      <g filter="url(#chalkmark2)" stroke-linecap="round">
        <path d="M14 11 L14 50 L53 50" stroke="currentColor" stroke-width="2.4"></path>
        <path d="M20 45 Q32 5 44 45" stroke="{{ accent }}" stroke-width="2.6"></path>
      </g>
    </svg>
  </sc-if>
  <sc-if value="{{ isChem }}" hint-placeholder-val="{{ true }}">
    <svg viewBox="0 0 64 64" width="100%" height="100%" fill="none" style="display:block;overflow:visible">
      <defs><filter id="chalkmark3" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap></filter></defs>
      <g filter="url(#chalkmark3)" stroke-linejoin="round" stroke-linecap="round">
        <path d="M25 11 L25 27 L13 49 Q12 54 17 54 L47 54 Q52 54 51 49 L39 27 L39 11" stroke="currentColor" stroke-width="2.4"></path>
        <path d="M22 11 L42 11" stroke="currentColor" stroke-width="2.4"></path>
        <path d="M17.5 45 L46.5 45" stroke="{{ accent }}" stroke-width="2.6"></path>
        <circle cx="27" cy="49.5" r="2" fill="{{ accent }}"></circle>
        <circle cx="35" cy="41" r="1.5" fill="currentColor"></circle>
      </g>
    </svg>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 80, &quot;height&quot;: 80},
  &quot;subject&quot;: {&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;physics&quot;,&quot;options&quot;:[&quot;physics&quot;,&quot;maths&quot;,&quot;chem&quot;],&quot;tsType&quot;:&quot;string&quot;},
  &quot;accent&quot;: {&quot;editor&quot;:null,&quot;default&quot;:&quot;#f2d585&quot;,&quot;tsType&quot;:&quot;string&quot;}
}">
class Component extends DCLogic {
  renderVals(){
    const s = this.props.subject || 'physics';
    return {
      isPhysics: s === 'physics',
      isMaths: s === 'maths',
      isChem: s === 'chem',
      accent: this.props.accent || '#f2d585'
    };
  }
}
</script>
</body>
</html>
