<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Orbit Architect</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#05081a;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Courier New',monospace;overflow:hidden;user-select:none;-webkit-user-select:none}
  .station{width:440px;height:660px;max-width:100vw;max-height:100vh;background:radial-gradient(ellipse at 50% 50%,#0d1540,#05081a);border:1px solid #2a4a7f44;position:relative;overflow:hidden;box-shadow:0 0 80px #1a3a6f33,inset 0 0 60px #0008}
  canvas{display:block;width:100%;height:100%}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#05081add;z-index:10;padding:28px;text-align:center;gap:14px}
  .overlay h1{font-size:22px;color:#4af;text-shadow:0 0 20px #4af8,0 0 40px #4af4;letter-spacing:3px}
  .overlay h2{font-size:14px;color:#6cf;text-shadow:0 0 8px #6cf}
  .overlay p{color:#8ac;font-size:11px;line-height:1.6;max-width:300px}
  .btn{background:transparent;border:1px solid #4af;color:#4af;font-family:'Courier New',monospace;font-size:13px;font-weight:bold;padding:10px 30px;cursor:pointer;letter-spacing:2px;transition:all .15s}
  .btn:hover{background:#4af1;box-shadow:0 0 24px #4af4}
  .btn:active{transform:scale(.96)}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="station">
  <canvas id="c"></canvas>
  <div class="overlay" id="ov">
    <h1>ORBIT ARCHITECT</h1>
    <p>Capture space debris with elliptical forcefields.<br>A circle is just a special ellipse.<br>Math comes later.</p>
    <button class="btn" id="startBtn">▶ DEPLOY</button>
  </div>
</div>

<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),ov=document.getElementById('ov');
const W=440,H=660;c.width=W;c.height=H;
const CX=W/2,CY=H/2;

let phase='title',level=0,score=0,frame=0;
let params={a:60,b:60,h:0,k:0};
let debris=[],debrisSet=null,currentTarget=0,captured=0,caught,levelData;
let stars=[];for(let i=0;i<80;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:.4+Math.random()*1.2,b:.15+Math.random()*.45});

const LEVELS=[
  {name:'SATELLITE 1 — ORBIT MATCH',briefing:'STRETCH THE FORCEFIELD.\n\nTwo controls:\n  ■ H-RADIUS — horizontal reach\n  ■ V-RADIUS — vertical reach\n\nA circle has equal radii.\nAn ellipse stretches one direction.',
   params:['a','b'],centerLocked:true,
   debris:[[{x:120,y:120},{x:-100,y:-80},{x:140,y:-60}],[{x:80,y:-110},{x:-130,y:50},{x:-60,y:-100}],[{x:150,y:30},{x:50,y:140},{x:-140,y:-20}]],
   reveal:'H-RADIUS stretches the ellipse horizontally.\nV-RADIUS stretches it vertically.\n\nA CIRCLE is an ellipse with a = b.\nAn ELLIPSE has a ≠ b.\n\nYou just classified conic sections.'},
  {name:'SATELLITE 2 — CENTER SHIFT',briefing:'NEW CONTROLS:\n  ■ X-CENTER — slide left/right\n  ■ Y-CENTER — slide up/down\n\nPlus H-RADIUS and V-RADIUS.\nThe ellipse can now orbit anywhere.',
   params:['a','b','h','k'],centerLocked:false,
   debris:[[{x:80,y:-80},{x:-120,y:100},{x:100,y:120}],[{x:-130,y:-100},{x:70,y:-120},{x:140,y:40}],[{x:-90,y:90},{x:110,y:-70},{x:-140,y:-20}]],
   reveal:'X-CENTER = h. Y-CENTER = k.\n\nThe ellipse center is (h, k).\n\nStandard form:\n(x−h)²/a² + (y−k)²/b² = 1\n\nh,k move it. a,b shape it.'},
  {name:'SATELLITE 3 — ROOT ACCESS',briefing:'⚠ LABELS FAILING ⚠\n\nRaw math parameters only.\nYou already know what every term does.',
   params:['a','b','h','k'],centerLocked:false,
   debris:[[{x:60,y:90},{x:-100,y:-70},{x:130,y:-40},{x:-80,y:100}],[{x:110,y:-100},{x:-70,y:110},{x:140,y:50},{x:-130,y:-30}],[{x:0,y:130},{x:100,y:80},{x:-120,y:-80},{x:80,y:-110}]],
   reveal:'YOU MASTERED ELLIPSES.\n\n(x−h)²/a² + (y−k)²/b² = 1\n\nh,k = center\na = horizontal semi-axis\nb = vertical semi-axis\n\nCircle: a = b. Ellipse: a ≠ b.\n\n★ ORBIT ARCHITECT ★'}
];

function startGame(){level=0;score=0;currentTarget=0;params={a:60,b:60,h:0,k:0};loadLevel();ov.classList.add('hidden')}

function loadLevel(){
  levelData=LEVELS[level];debrisSet=levelData.debris[currentTarget];
  caught={};captured=0;phase='playing';
  if(levelData.centerLocked){params.h=0;params.k=0}
  debris=debrisSet.map((d,i)=>({...d,id:i,caught:false,dx:(Math.random()-.5)*.4,dy:(Math.random()-.5)*.4}));
}

function inside(x,y){const dx=(x-params.h)/params.a,dy=(y-params.k)/params.b;return dx*dx+dy*dy<=1}

function checkCapture(){
  for(const d of debris){if(d.caught)continue;if(inside(d.x,d.y)){d.caught=true;caught[d.id]=true;captured++;score++}}
  if(captured>=debrisSet.length){phase='success';
    setTimeout(()=>{if(currentTarget<levelData.debris.length-1){currentTarget++;loadLevel()}else{phase='reveal';showReveal()}},1400);}
}

function showReveal(){
  const lv=LEVELS[level];
  ov.innerHTML=`<h1>DECODED</h1><p style="white-space:pre-line;color:#4af;text-shadow:0 0 8px #4af">${lv.reveal}</p><p style="color:#ff0">★ ${score} DEBRIS CAPTURED ★</p>${level<2?'<button class="btn" id="nextBtn">▶ NEXT SATELLITE</button>':'<button class="btn" id="replayBtn">▶ REPLAY</button>'}`;
  ov.classList.remove('hidden');
  const btn=document.getElementById('nextBtn')||document.getElementById('replayBtn');
  btn.onclick=()=>{if(level<2){level++;currentTarget=0;loadLevel()}else{level=0;currentTarget=0;score=0;startGame()}ov.classList.add('hidden')};
}

// Keyboard
document.addEventListener('keydown',e=>{
  if(phase!=='playing')return;
  const lv=LEVELS[level],k=e.key.toLowerCase();
  if(lv.params.includes('a')){if(k==='a')params.a=Math.max(20,params.a-4);if(k==='d')params.a=Math.min(180,params.a+4)}
  if(lv.params.includes('b')){if(k==='w')params.b=Math.min(180,params.b+4);if(k==='s')params.b=Math.max(20,params.b-4)}
  if(!lv.centerLocked){
    if(k==='arrowleft'||k==='j')params.h=Math.max(-180,params.h-4);
    if(k==='arrowright'||k==='l')params.h=Math.min(180,params.h+4);
    if(k==='arrowup'||k==='i')params.k=Math.min(180,params.k+4);
    if(k==='arrowdown'||k==='k')params.k=Math.max(-180,params.k-4);
  }
  checkCapture();e.preventDefault();
});

// Touch
let tIdx=null;
c.addEventListener('touchstart',e=>{
  if(phase!=='playing')return;
  const r=c.getBoundingClientRect(),py=(e.touches[0].clientY-r.top)*(H/r.height);
  if(py>H*.76){const px=(e.touches[0].clientX-r.left)*(W/r.width);tIdx=Math.floor((px/W)*LEVELS[level].params.length)}
  e.preventDefault()
},{passive:false});
c.addEventListener('touchmove',e=>{
  if(tIdx===null)return;
  const r=c.getBoundingClientRect(),px=(e.touches[0].clientX-r.left)*(W/r.width);
  const key=LEVELS[level].params[tIdx],val=px/W;
  if(key==='a')params.a=20+val*160;if(key==='b')params.b=20+val*160;
  if(key==='h')params.h=-180+val*360;if(key==='k')params.k=-180+val*360;
  checkCapture();e.preventDefault()
},{passive:false});
c.addEventListener('touchend',()=>{tIdx=null});

// Draw
function draw(){
  ctx.fillStyle='#05081a';ctx.fillRect(0,0,W,H);
  for(const s of stars){ctx.fillStyle=`rgba(200,220,255,${s.b})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}
  // Planet
  const p=1+Math.sin(frame*.02)*.03;
  let g=ctx.createRadialGradient(CX,CY,10*p,CX,CY,58*p);
  g.addColorStop(0,'#4af8');g.addColorStop(.3,'#28f6');g.addColorStop(.7,'#0a2a5a44');g.addColorStop(1,'transparent');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(CX,CY,58*p,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#aaf';ctx.beginPath();ctx.arc(CX,CY,8,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#4af2';ctx.lineWidth=1;ctx.beginPath();ctx.arc(CX,CY,80,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='#4af1';ctx.lineWidth=.5;ctx.beginPath();ctx.arc(CX,CY,120,0,Math.PI*2);ctx.stroke();
  // Ellipse
  const ex=params.h+CX,ey=params.k+CY,a=params.a,b=params.b;
  ctx.beginPath();ctx.ellipse(ex,ey,a,b,0,0,Math.PI*2);
  g=ctx.createRadialGradient(ex,ey,Math.min(a,b)*.3,ex,ey,Math.max(a,b));
  g.addColorStop(0,'#4af0');g.addColorStop(.5,'#4af2');g.addColorStop(1,'#4af0');
  ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#8cf';ctx.lineWidth=2.5;ctx.shadowColor='#4af';ctx.shadowBlur=18;ctx.stroke();ctx.shadowBlur=0;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,3,0,Math.PI*2);ctx.fill();
  ctx.setLineDash([3,5]);ctx.strokeStyle='#4af5';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(ex-a,ey);ctx.lineTo(ex+a,ey);ctx.stroke();
  ctx.beginPath();ctx.moveTo(ex,ey-b);ctx.lineTo(ex,ey+b);ctx.stroke();ctx.setLineDash([]);
  // Debris
  for(const d of debris){
    if(d.caught){ctx.fillStyle='#4af';ctx.globalAlpha=.5;ctx.shadowColor='#4af';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(d.x+CX,d.y+CY,3,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1;continue}
    d.x+=d.dx;d.y+=d.dy;if(Math.abs(d.x)>190)d.dx*=-1;if(Math.abs(d.y)>210)d.dy*=-1;
    ctx.fillStyle='#ff8';ctx.shadowColor='#ff8';ctx.shadowBlur=8;ctx.beginPath();ctx.arc(d.x+CX,d.y+CY,4,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  }
  // HUD
  if(levelData){ctx.fillStyle='#05081acc';ctx.fillRect(0,0,W,26);ctx.fillStyle='#4af';ctx.font='bold 9px monospace';ctx.fillText(`SATELLITE ${level+1} · SWEEP ${currentTarget+1}/${levelData.debris.length}`,10,17);ctx.fillText(`CAPTURED: ${captured}/${debrisSet.length}`,W-160,17);
  const sy=H-100,active=levelData.params,labels={a:'H-R',b:'V-R',h:'X-C',k:'Y-C'},keys2={a:'A/D',b:'W/S',h:'J/L',k:'I/K'};
  active.forEach((key,i)=>{const x=12+(W-24)*i/active.length,w=(W-24)/active.length-8,val=params[key],maxV=180,minV=key==='h'||key==='k'?-180:0;
    let dV=level>1?(key==='a'?'a='+Math.round(val):key==='b'?'b='+Math.round(val):key==='h'?'h='+Math.round(val):'k='+Math.round(val)):Math.round(val);
    ctx.fillStyle='#8cf';ctx.font='bold 9px monospace';ctx.fillText(labels[key]+' '+dV,x,sy+18);
    ctx.fillStyle='#2a4a7f44';ctx.fillRect(x,sy+26,w,8);ctx.fillStyle='#4af';ctx.fillRect(x,sy+26,w*((val-minV)/(maxV-minV)),8);
    ctx.fillStyle='#4af6';ctx.font='8px monospace';ctx.fillText(keys2[key],x,sy+52)});}
  if(phase==='success'){ctx.fillStyle='rgba(0,100,255,.08)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#4af';ctx.font='bold 20px monospace';ctx.textAlign='center';ctx.fillText('ORBIT SECURED',W/2,H/2-20);ctx.textAlign='start'}
  if(level>1&&frame%25<4){ctx.fillStyle='rgba(0,150,255,.03)';for(let i=0;i<2;i++)ctx.fillRect(Math.random()*W,Math.random()*H,Math.random()*60,Math.random()*2)}
}

function loop(){frame++;if(phase!=='title')draw();requestAnimationFrame(loop)}
document.getElementById('startBtn').onclick=startGame;
loop();
</script>
</body>
</html>
