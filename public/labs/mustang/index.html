<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mustang Lab — Physics observations</title>
<style>
  :root {
    --bg: #0d0f14;
    --panel: #171a21;
    --panel-2: #1e222b;
    --line: #2a2f3a;
    --text: #e6e9ef;
    --muted: #9aa3b2;
    --accent: #35d07f;
    --bad: #ff5c5c;
    --eq: #7fb2ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-columns: 1fr 380px; overflow: hidden;
  }
  #viewport { position: relative; min-width: 0; }
  #viewport canvas { display: block; width: 100%; height: 100%; }
  #title {
    position: absolute; top: 14px; left: 16px; pointer-events: none;
    background: rgba(0,0,0,.55); padding: 7px 13px; border-radius: 8px;
    font-size: 13px; color: #cfd6e2; backdrop-filter: blur(4px);
  }
  #legend {
    position: absolute; bottom: 14px; left: 16px;
    background: rgba(0,0,0,.55); border-radius: 8px;
    font-size: 12px; backdrop-filter: blur(4px);
    padding: 0; overflow: hidden;
  }
  #legend summary {
    list-style: none; cursor: pointer; padding: 8px 13px;
    color: #cfd6e2; font-size: 12px; user-select: none;
  }
  #legend summary::-webkit-details-marker { display: none; }
  #legend summary::after { content: ' ▾'; opacity: .6; }
  #legend[open] summary::after { content: ' ▴'; }
  #legend .legend-body { padding: 0 13px 10px; line-height: 1.9; }
  #legend i { display: inline-block; width: 11px; height: 11px; border-radius: 2px;
    margin-right: 7px; vertical-align: -1px; }

  #surface-banner {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    padding: 10px 22px; border-radius: 10px; pointer-events: none;
    background: rgba(0,0,0,.55); backdrop-filter: blur(6px);
    color: #eef2f8; font-size: 15px; letter-spacing: .16em; text-transform: uppercase;
    opacity: 0; transition: opacity .35s ease; z-index: 3;
  }
  #surface-banner.visible { opacity: 1; }

  aside { display: flex; flex-direction: column; border-left: 1px solid var(--line);
    background: var(--panel); overflow: hidden; }

  /* One scrolling pane per tab, so nothing important sits below a long scroll. */
  #panes { flex: 1 1 auto; overflow-y: auto; min-height: 0; }
  .pane { display: none; }
  .pane.active { display: block; }
  #lesson { padding: 18px 18px 20px; }
  #hud { padding: 14px 18px 20px; }

  #tabs { display: flex; border-bottom: 1px solid var(--line); background: var(--panel); }
  #tabs button {
    flex: 1; padding: 10px 6px; background: none; border: none; cursor: pointer;
    color: var(--muted); font: inherit; font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .07em;
    border-bottom: 2px solid transparent;
  }
  #tabs button:hover { color: var(--text); }
  #tabs button.active { color: var(--text); border-bottom-color: var(--eq); }

  /* Driver bar — pinned, so the car is drivable from any tab. */
  #driver {
    flex: 0 0 auto; border-top: 1px solid var(--line); background: #141820;
    padding: 10px 16px 12px;
  }
  .driver-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .driver-grid .slider { margin: 0; }
  .driver-row { display: flex; gap: 8px; align-items: center; margin-top: 9px; }
  .driver-row .sel { flex: 1; }
  .driver-row .sel select { margin-top: 0; padding: 6px; font-size: 12px; }
  .driver-row button {
    padding: 6px 12px; border-radius: 6px; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); cursor: pointer; font: inherit; font-size: 12px;
  }
  .driver-row button:hover { border-color: var(--accent); }
  .hint-row { font-size: 12px; color: var(--muted); gap: 14px; }
  .hint-row label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .hint-row .hint { margin: 0; }

  h2 { font-size: 17px; margin: 4px 0 10px; }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  h3 .sub { text-transform: none; letter-spacing: 0; font-weight: 400; opacity: .7; }
  p, ul { margin: 0 0 10px; }
  ul { padding-left: 18px; }
  li { margin-bottom: 5px; }
  .step-count { font-size: 11px; color: var(--muted); letter-spacing: .08em;
    text-transform: uppercase; }
  .lesson-body { font-size: 14px; color: #d3d9e4; }
  .eq { font-family: ui-monospace, "SF Mono", Menlo, monospace; color: var(--eq);
    font-size: 13px; }
  p.eq { text-align: center; padding: 7px; background: var(--panel-2);
    border-radius: 6px; margin: 10px 0; }

  .quiz { margin: 12px 0; display: flex; flex-direction: column; gap: 7px; }
  .choice { text-align: left; padding: 10px 12px; border-radius: 8px; cursor: pointer;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    font: inherit; font-size: 13.5px; transition: .15s; }
  .choice:hover:not(:disabled) { border-color: #444c5c; }
  .choice.right { border-color: var(--accent); background: #14301f; }
  .choice.wrong { border-color: var(--bad); background: #2e1414; }
  .choice.muted { opacity: .45; }
  .quiz-answer { margin-top: 10px; padding: 12px; border-radius: 8px;
    background: var(--panel-2); border-left: 3px solid var(--accent); font-size: 13.5px; }

  .goal { margin: 12px 0; padding: 9px 12px; border-radius: 8px; font-size: 13px;
    background: var(--panel-2); border: 1px dashed var(--line); color: var(--muted); }
  .goal.met { border-style: solid; border-color: var(--accent); color: var(--accent); }

  .lesson-nav { display: flex; gap: 8px; margin: 16px 0 8px; }
  .nav { flex: 1; padding: 9px; border-radius: 8px; cursor: pointer; font: inherit;
    font-size: 13px; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); }
  .nav.primary { background: #1d3b2a; border-color: #2c5a3f; }
  .nav:disabled { opacity: .35; cursor: default; }

  table.mini { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13px; }
  table.mini th, table.mini td { text-align: left; padding: 5px 6px;
    border-bottom: 1px solid var(--line); }
  table.mini th { color: var(--muted); font-weight: 600; font-size: 11px;
    text-transform: uppercase; letter-spacing: .06em; }

  .panel { background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 13px 14px; margin-bottom: 12px; }
  .slider { display: block; margin-bottom: 9px; font-size: 13px; }
  .slider span { display: flex; justify-content: space-between; color: var(--muted); }
  .slider .v { color: var(--text); }
  .slider input { width: 100%; margin-top: 4px; accent-color: var(--accent); }
  .hint { font-size: 12px; color: var(--muted); margin: 2px 0 10px; }
  kbd { background: #2a2f3a; border-radius: 4px; padding: 1px 5px; font-size: 11px;
    border: 1px solid #3a4150; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  .sel { flex: 1; font-size: 12px; color: var(--muted); }
  .sel select { width: 100%; margin-top: 4px; padding: 6px; border-radius: 6px;
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    font: inherit; font-size: 13px; }
  .toggles { flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
  .toggles label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .toggles button { margin-left: auto; padding: 5px 12px; border-radius: 6px;
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    cursor: pointer; font: inherit; font-size: 12.5px; }

  .gauge .bar { position: relative; height: 16px; border-radius: 8px;
    background: #0f1218; overflow: hidden; border: 1px solid var(--line); }
  .gauge .fill { height: 100%; width: 0; background: var(--accent); transition: width .06s linear; }
  .gauge .fill.over { background: var(--bad); }
  .bar-labels { display: flex; justify-content: space-between; font-size: 12px;
    color: var(--muted); margin-top: 6px; }
  .bar-labels b { color: var(--text); }
  .status { margin-top: 9px; font-size: 12.5px; color: var(--accent); }
  .status.bad { color: var(--bad); font-weight: 600; }

  table.tele { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.tele td { padding: 4px 0; border-bottom: 1px solid #23272f; }
  table.tele td:first-child { color: var(--muted); }
  table.tele td:last-child { text-align: right; font-variant-numeric: tabular-nums; }

  .verify-line { margin: 0 0 6px; font-size: 13px; color: #d3d9e4; line-height: 1.5; }
  .verify-line:last-child { margin-bottom: 0; }

  #observations { padding: 16px 18px 20px; }
  #observations h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase;
    letter-spacing: .09em; color: var(--muted); font-weight: 600; }
  .booklet-intro { font-size: 12.5px; color: var(--muted); margin: 0 0 12px; line-height: 1.45; }
  .booklet-list { list-style: none; margin: 0; padding: 0; }
  .booklet-item {
    display: flex; gap: 10px; margin-bottom: 12px; padding: 6px 8px 12px;
    border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .booklet-item:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
  .booklet-num {
    flex: 0 0 22px; height: 22px; border-radius: 50%; background: var(--panel-2);
    border: 1px solid var(--line); font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; color: var(--eq);
  }
  .booklet-text { font-size: 13px; color: #d3d9e4; line-height: 1.5; }
  .booklet-text strong { display: block; font-size: 13.5px; color: var(--text); margin-bottom: 4px; }
  .booklet-text p { margin: 0; }
  .booklet-item:hover .booklet-num { border-color: var(--eq); }

  #callouts {
    position: absolute; top: 56px; right: 14px; display: flex; flex-direction: column;
    gap: 6px; pointer-events: none; z-index: 2;
  }
  .callout {
    background: rgba(0,0,0,.62); padding: 5px 10px; border-radius: 6px;
    font-size: 12px; color: #cfd6e2; backdrop-filter: blur(4px);
    border: 1px solid transparent; line-height: 1.3;
    transition: border-color .15s, background .15s, transform .15s;
  }
  .callout .num { color: var(--eq); font-weight: 700; margin-right: 5px; }
  .callout-active {
    border-color: var(--eq); background: rgba(127,178,255,.22);
    color: #fff; transform: translateX(-4px);
    box-shadow: 0 0 0 2px rgba(127,178,255,.28);
  }

  #observe-grip.observe-highlight,
  #observe-brake.observe-highlight,
  #observe-verify.observe-highlight,
  #observe-surface.observe-highlight,
  #observe-preset.observe-highlight,
  #observe-mass.observe-highlight,
  #observe-fnet.observe-highlight,
  #observe-accel.observe-highlight,
  #observe-n.observe-highlight {
    outline: 2px solid var(--eq);
    outline-offset: 2px;
    border-radius: 8px;
    background: rgba(127,178,255,.10);
  }

  .booklet-item { border-radius: 8px; transition: background .15s; }
  .booklet-item:hover { background: rgba(127,178,255,.07); }
  .booklet-item.pinned { background: rgba(127,178,255,.13); }
  .booklet-item.pinned .booklet-num { border-color: var(--eq); color: #fff; background: #2c4260; }

  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; }
    aside { border-left: none; border-top: 1px solid var(--line); }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <main id="viewport">
    <div id="title">1969 Mustang Boss 302 — measured test lane, markers every 10 m</div>
    <div id="callouts" aria-hidden="true">
      <div class="callout" data-ref="observe-fnet"><span class="num">①</span> F<sub>net</sub></div>
      <div class="callout" data-ref="observe-accel"><span class="num">②</span> a</div>
      <div class="callout" data-ref="observe-n"><span class="num">③</span> N</div>
      <div class="callout" data-ref="observe-grip"><span class="num">④</span> μ<sub>s</sub>·N</div>
    </div>
    <div id="surface-banner" aria-hidden="true"></div>
    <details id="legend">
      <summary>Force key</summary>
      <div class="legend-body">
        <i style="background:#35d07f"></i>Driving force (road → car)<br>
        <i style="background:#9fe870"></i>Reaction (tyre → road)<br>
        <i style="background:#ff5c5c"></i>Air resistance<br>
        <i style="background:#ffa93d"></i>Rolling resistance<br>
        <i style="background:#ff2fb3"></i>Braking<br>
        <i style="background:#6aa9ff"></i>Weight (mg)<br>
        <i style="background:#c77dff"></i>Normal reaction
      </div>
    </details>
  </main>

  <aside>
    <div id="lesson-bar" style="display:flex; gap:6px; padding:8px 18px; border-bottom:1px solid var(--line); align-items:center;">
      <select id="lesson-pick" style="flex:1; padding:6px; border-radius:6px; background:var(--panel-2); color:var(--text); border:1px solid var(--line); font:inherit; font-size:13px;"></select>
    </div>

    <nav id="tabs">
      <button data-pane="observations" class="active">Observe</button>
      <button data-pane="lesson">Lesson</button>
      <button data-pane="hud">Instruments</button>
    </nav>

    <div id="panes">
      <section id="observations" class="pane active"></section>
      <section id="lesson" class="pane"></section>
      <section id="hud" class="pane"></section>
    </div>

    <div id="driver"></div>
  </aside>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
